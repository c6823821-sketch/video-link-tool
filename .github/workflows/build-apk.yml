name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Bundle offline ASR model
        run: |
          mkdir -p app/src/main/assets
          curl -L --retry 5 --connect-timeout 30 --max-time 600 \
            -o /tmp/vosk-model-small-cn-0.3.zip \
            "https://alphacephei.com/vosk/models/vosk-model-small-cn-0.3.zip"
          unzip -q -o /tmp/vosk-model-small-cn-0.3.zip -d app/src/main/assets/
          test -f app/src/main/assets/vosk-model-small-cn-0.3/final.mdl

      - name: Build universal release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Prepare release assets
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            cp app/build/outputs/apk/release/app-release.apk "VideoLinkTool-v${VERSION}.apk"
            ./gradlew --no-daemon :app:assembleRelease -PabiFilter=arm64
            cp app/build/outputs/apk/release/app-release.apk "VideoLinkTool-v${VERSION}-arm64.apk"
          else
            cp app/build/outputs/apk/release/app-release.apk "VideoLinkTool-release.apk"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoLinkTool-release
          path: |
            VideoLinkTool-v*.apk
            VideoLinkTool-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VideoLinkTool-v*.apk
          generate_release_notes: true
