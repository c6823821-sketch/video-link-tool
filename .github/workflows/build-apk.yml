name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Bundle offline ASR model
        run: |
          mkdir -p app/src/main/assets
          curl -L --retry 5 --connect-timeout 30 --max-time 600 \
            -o /tmp/vosk-model-small-cn-0.3.zip \
            "https://alphacephei.com/vosk/models/vosk-model-small-cn-0.3.zip"
          unzip -q -o /tmp/vosk-model-small-cn-0.3.zip -d app/src/main/assets/
          test -f app/src/main/assets/vosk-model-small-cn-0.3/final.mdl

      - name: Restore Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/videolinktool-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/videolinktool-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build universal release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Prepare release assets
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            cp app/build/outputs/apk/release/app-release.apk "VideoLinkTool-v${VERSION}.apk"
            ./gradlew --no-daemon :app:assembleRelease -PabiFilter=arm64
            cp app/build/outputs/apk/release/app-release.apk "VideoLinkTool-v${VERSION}-arm64.apk"
          else
            cp app/build/outputs/apk/release/app-release.apk "VideoLinkTool-release.apk"
          fi

      - name: Verify release signing certificate
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          APK=$(ls VideoLinkTool-v*.apk VideoLinkTool-release.apk 2>/dev/null | head -n 1)
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*SHA-256 digest: //p' | head -n 1)
          test "$CERT" = "6abd42e63859ea6095d76e1a123d3307b067d524915cf03036a8b04e10b8f81e"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoLinkTool-release
          path: |
            VideoLinkTool-v*.apk
            VideoLinkTool-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VideoLinkTool-v*.apk
          generate_release_notes: true
