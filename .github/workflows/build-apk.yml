name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Bundle offline ASR model
        run: |
          mkdir -p app/src/main/assets/sensevoice
          curl -L --retry 5 --connect-timeout 30 --max-time 1800 \
            -o app/src/main/assets/sensevoice/model.int8.onnx \
            "https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx"
          curl -L --retry 5 --connect-timeout 30 --max-time 300 \
            -o app/src/main/assets/sensevoice/tokens.txt \
            "https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt"
          test "$(stat -c%s app/src/main/assets/sensevoice/model.int8.onnx)" -gt 200000000
          test "$(stat -c%s app/src/main/assets/sensevoice/tokens.txt)" -gt 100000
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoLinkTool-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

