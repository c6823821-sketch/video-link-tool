name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Bundle offline ASR model
        run: |
          mkdir -p app/src/main/assets
          curl -L --retry 5 --connect-timeout 30 --max-time 600 \
            -o /tmp/vosk-model-small-cn-0.3.zip \
            "https://alphacephei.com/vosk/models/vosk-model-small-cn-0.3.zip"
          unzip -q -o /tmp/vosk-model-small-cn-0.3.zip -d app/src/main/assets/
          test -f app/src/main/assets/vosk-model-small-cn-0.3/final.mdl

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoLinkTool-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
